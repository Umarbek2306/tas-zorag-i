<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор договора | TEXNIKA ADVANS SERVIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --navy: #0f1f3d;
            --navy-mid: #1a3260;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --cream: #f8f5ef;
            --cream-dark: #ede8df;
            --text: #1e1e2e;
            --text-muted: #6b6b80;
            --white: #ffffff;
            --border: #d4cec4;
            --radius: 10px;
            --shadow: 0 2px 20px rgba(15,31,61,0.10);
        }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        .header {
            background: var(--navy);
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 20px; }
        .main {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            padding: 0 20px;
        }
        .section-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 20px;
        }
        h2 { font-family: 'Playfair Display', serif; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .spec-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .spec-table th { background: var(--navy); color: var(--gold-light); padding: 12px; text-align: left; font-size: 12px; }
        .spec-table td { padding: 10px; border-bottom: 1px solid var(--border); }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-family: inherit;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }
        .btn-add { background: var(--cream-dark); color: var(--navy); margin-top: 15px; }
        .btn-download {
            background: var(--gold);
            color: var(--navy);
            width: 100%;
            font-size: 16px;
            padding: 15px;
            margin-top: 20px;
        }
        .sidebar-card {
            background: var(--navy);
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            position: sticky;
            top: 20px;
        }
        .total-label { color: var(--gold-light); font-size: 12px; text-transform: uppercase; }
        .total-val { font-family: 'IBM Plex Mono', monospace; font-size: 24px; display: block; margin-top: 5px; }
        .btn-del-row { color: #c0392b; background: none; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <h1>TEXNIKA ADVANS SERVIS</h1>
    </div>
    <div>Генератор договоров v1.0</div>
</div>

<div class="main" id="app-content">
    <div class="form-area">
        <div class="section-card">
            <h2>Данные договора</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div>
                    <label>Номер договора</label>
                    <input type="text" placeholder="№ TAS-2024/001">
                </div>
                <div>
                    <label>Дата</label>
                    <input type="date">
                </div>
            </div>
        </div>

        <div class="section-card">
            <h2>Спецификация товаров</h2>
            <table class="spec-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">№</th>
                        <th>Наименование</th>
                        <th style="width: 80px;">Кол-во</th>
                        <th style="width: 150px;">Цена</th>
                        <th style="width: 150px;">Сумма</th>
                        <th style="width: 40px;"></th>
                    </tr>
                </thead>
                <tbody id="spec-body">
                    <tr>
                        <td>1</td>
                        <td><input type="text" value="Пример товара"></td>
                        <td><input type="number" class="qty-input" value="1"></td>
                        <td><input type="number" class="price-input" value="1000000"></td>
                        <td class="row-total">1 000 000</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn btn-add" onclick="addRow()">+ Добавить товар</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-card">
            <span class="total-label">Общая сумма:</span>
            <span class="total-val" id="total-amount">1 000 000</span>
            <span style="font-size: 12px; opacity: 0.7;">UZS (сум)</span>
            
            <button class="btn btn-download" onclick="generatePDF()">СКАЧАТЬ PDF</button>
        </div>
    </div>
</div>

<script>
    const specBody = document.getElementById('spec-body');
    const totalDisplay = document.getElementById('total-amount');

    function calculate() {
        let total = 0;
        const rows = specBody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.cells[0].innerText = index + 1;
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            const sum = qty * price;
            row.querySelector('.row-total').innerText = sum.toLocaleString('ru-RU');
            total += sum;
        });
        totalDisplay.innerText = total.toLocaleString('ru-RU');
    }

    specBody.addEventListener('input', calculate);

    function addRow() {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td></td>
            <td><input type="text" placeholder="Введите название"></td>
            <td><input type="number" class="qty-input" value="1"></td>
            <td><input type="number" class="price-input" value="0"></td>
            <td class="row-total">0</td>
            <td><button class="btn-del-row" onclick="this.closest('tr').remove(); calculate();">×</button></td>
        `;
        specBody.appendChild(tr);
        calculate();
    }

    function generatePDF() {
        const element = document.getElementById('app-content');
        const btn = document.querySelector('.btn-download');
        btn.innerText = "Генерация...";
        
        const opt = {
            margin: 10,
            filename: 'Dogovor_TAS.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "СКАЧАТЬ PDF";
        });
    }
</script>

</body>
</html>
